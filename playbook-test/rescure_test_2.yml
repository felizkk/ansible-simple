---
- name: Rescue Test
  hosts: all
  gather_facts: false

  vars:
    patch_unprepared_hosts:
      - fkarnadi-rhel-dev.kvm.local
      - fkarnadi-rhel-foobar.kvm.local
      
  tasks:
    - name: debug hostname
      ansible.builtin.debug:
        var: inventory_hostname

    - name: debug patch_unprepared_hosts
      ansible.builtin.debug:
        var: patch_unprepared_hosts

    - name: fail 
      ansible.builtin.fail:
        msg: "simulated fail"
      when: inventory_hostname in patch_unprepared_hosts

    - name: debug hostname
      ansible.builtin.debug:
        var: inventory_hostname
